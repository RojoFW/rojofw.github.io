name: Publicar blog

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código de dev
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar Astro
        run: pnpm build

      - name: Preparar archivos para GitHub Pages
        run: touch dist/.nojekyll

      - name: Guardar sitio compilado en main
        run: |
          git fetch origin main
          git worktree add --detach _published origin/main
          rsync -a --delete --exclude=.git dist/ _published/
          git -C _published add -A
          if ! git -C _published diff --cached --quiet; then
            git -C _published -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publicar sitio desde dev (${GITHUB_SHA})"
            git -C _published push origin HEAD:main
          fi

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
